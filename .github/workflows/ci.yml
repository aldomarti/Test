# This is a basic workflow to help you get started with Actions

name: CI
run-name: "CI-1.0.${{ github.run_number }}"

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: 
      - main
#  pull_request:
#    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
    VERSION: 1.0.${{ github.run_number }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build1:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Checkout the config repository to read shared variables
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/config
          token: ${{ secrets.GITHUB_TOKEN }}
          path: _config

      # Parse dso/build/default.yml and export all key-value pairs as environment variables
      - name: Load variables from dso/build/default.yml
        run: |
          python3 - <<'EOF'
          import yaml, os
          with open('_config/dso/build/default.yml', 'r') as f:
              data = yaml.safe_load(f)
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              for key, value in data.items():
                  env_file.write(f'{key}={value}\n')
          EOF

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo "Hello, world ${{ env.VERSION }}!"

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
          echo ${{ env.AWS_REGION }}
          echo ${{ env.AWS_USER_UPLOAD }}
          echo ${{ env.ARTIFACTORY_URL }}

      - name: replace and file
        run: |
          grep -oP '\$\{\K[^}]+' ingesta-dso-lambda-ecr-serverless.json | sort -u | while read -r var; do
            sed -i "s|\${${var}}|${!var}|g" ingesta-dso-lambda-ecr-serverless.json
          done
        working-directory: ${{ github.workspace }}
      
      - name: Display the modified JSON file
        run: cat ingesta-dso-lambda-ecr-serverless.json