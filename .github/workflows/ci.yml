# This is a basic workflow to help you get started with Actions

name: CI
run-name: "CI-1.0.${{ github.run_number }}"

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: 
      - main
#  pull_request:
#    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
    VERSION: 1.0.${{ github.run_number }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build1:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo "Hello, world ${{ env.VERSION }}!"

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      - name: Crear zip
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          ZIP_NAME="${REPO_NAME}-${{ env.VERSION }}.zip"
          zip -r "$ZIP_NAME" proyecto1/
          echo "Archivo creado: $ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Subir zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-proyecto1
          path: ${{ env.ZIP_NAME }}

      # - name: Simular error
      #   run: exit 1
  build2:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo "Hello, world ${{ env.VERSION }}!"

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.

      - name: Build Docker imagen
        run: |
          docker build -t proyecto2:${{ env.VERSION }} proyecto2/
          docker images

      - name: Zipear imagen Docker
        run: |
          IMAGE_TAR="proyecto2-${{ env.VERSION }}.tar"
          docker save proyecto2:${{ env.VERSION }} -o "$IMAGE_TAR"
          echo "Imagen exportada: $IMAGE_TAR"
          echo "IMAGE_TAR=$IMAGE_TAR" >> $GITHUB_ENV

      - name: Subir zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-proyecto2
          path: ${{ env.IMAGE_TAR }}

      # - name: Simular error
      #   run: exit 1

  build3:
    needs: [build1, build2]
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Descargar artifact proyecto1
        uses: actions/download-artifact@v4
        with:
          name: artifact-proyecto1
          path: artifacts/proyecto1

      - name: Descargar artifact proyecto2
        uses: actions/download-artifact@v4
        with:
          name: artifact-proyecto2
          path: artifacts/proyecto2

      # - name: Descomprimir artifact proyecto1
      #   run: |
      #     mkdir -p extracted/proyecto1
      #     unzip artifacts/proyecto1/*.zip -d extracted/proyecto1/

      - name: Descomprimir artifact proyecto2
        run: |
          docker load -i artifacts/proyecto2/*.tar
          echo "Imagen restaurada:"
          docker images proyecto2

      - name: Listar artefactos extraidos
        run: |
          echo "=== proyecto1 ==="
          ls -la extracted/proyecto1/
          echo "=== proyecto2 ==="
          ls -la extracted/proyecto2/
          docker images