# Continuous Deployment - PRD

name: CD_PRD
run-name: "CD-PRD-${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      frutas:
        description: "Seleccionar fruta"
        type: choice
        default: "Ninguna"
        options:
          - Ninguna
          - Manzana
          - Naranja
          - Banana
          - Uva
          - Fresa

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-cd-uat:
    runs-on: ubuntu-latest
    outputs:
      cd_uat_status: ${{ steps.get_cd_uat.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CD_UAT
        id: get_cd_uat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow cd_uat.yml \
            --branch main \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CD_UAT conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  block-on-uat-failure:
    needs: check-cd-uat
    if: needs.check-cd-uat.outputs.cd_uat_status != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Error - CD_UAT no finalizo correctamente
        run: |
          echo "::error::El pipeline CD_UAT termino con estado '${{ needs.check-cd-uat.outputs.cd_uat_status }}'. El deploy a PRD fue bloqueado."
          exit 1

  deploy-prd:
    needs: check-cd-uat
    if: needs.check-cd-uat.outputs.cd_uat_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Checkout the config repository to read shared variables
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/config
          token: ${{ secrets.GITHUB_TOKEN }}
          path: _config

      # Parse dso/uat/default.yml and export all key-value pairs as environment variables
      - name: Load variables from dso/uat/default.yml
        run: |
          python3 - <<'EOF'
          import yaml, os
          with open('_config/dso/uat/default.yml', 'r') as f:
              data = yaml.safe_load(f)
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              for key, value in data.items():
                  env_file.write(f'{key}={value}\n')
          EOF

      - name: Mostrar version y frutas seleccionadas
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Fruta seleccionada: ${{ github.event.inputs.frutas }}"

      - name: Deploy a UAT
        run: |
          echo "Desplegando version ${{ env.VERSION }} en UAT"
          echo ${{ env.AWS_REGION }}
          echo ${{ env.AWS_USER_UPLOAD }}
          echo ${{ env.AWS_USER_DOWNLOAD }}
          echo ${{ env.ARTIFACTORY_URL }}