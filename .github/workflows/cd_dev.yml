# Continuous Deployment - Dev

name: CD_DEV
run-name: "CD-DEV-${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      frutas:
        description: "Seleccionar fruta"
        type: choice
        default: "Ninguna"
        options:
          - Ninguna
          - Manzana
          - Naranja
          - Banana
          - Uva
          - Fresa
          - Pera

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-ci:
    runs-on: ubuntu-latest
    outputs:
      ci_status: ${{ steps.get_ci.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CI
        id: get_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow ci.yml \
            --branch main \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CI conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  block-on-ci-failure:
    needs: check-ci
    if: needs.check-ci.outputs.ci_status != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Error - CI no finalizo correctamente
        run: |
          echo "::error::El pipeline CI termino con estado '${{ needs.check-ci.outputs.ci_status }}'. El deploy a DEV fue bloqueado."
          exit 1

  deploy-dev:
    needs: check-ci
    if: needs.check-ci.outputs.ci_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Checkout the config repository to read shared variables
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/config
          token: ${{ secrets.GITHUB_TOKEN }}
          path: _config

      # Parse dso/dev/default.yml and export all key-value pairs as environment variables
      - name: Load variables from dso/dev/default.yml
        run: |
          python3 - <<'EOF'
          import yaml, os
          with open('_config/dso/dev/default.yml', 'r') as f:
              data = yaml.safe_load(f)
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              for key, value in data.items():
                  env_file.write(f'{key}={value}\n')
          EOF

      - name: Mostrar version y frutas seleccionadas
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Fruta seleccionada: ${{ github.event.inputs.frutas }}"

      - name: Deploy a DEV
        run: |
          echo "Desplegando version ${{ env.VERSION }} en DEV"
          echo ${{ env.AWS_REGION }}
          echo ${{ env.AWS_USER_UPLOAD }}
          echo ${{ env.ARTIFACTORY_URL }}


    #   - name: Simular error
    #     run: exit 1
