# Continuous Deployment - Dev

name: CD_DEV
run-name: "CD-DEV-${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      fruta_manzana:
        description: "Manzana"
        type: boolean
        default: false
      fruta_naranja:
        description: "Naranja"
        type: boolean
        default: false
      fruta_banana:
        description: "Banana"
        type: boolean
        default: false
      fruta_uva:
        description: "Uva"
        type: boolean
        default: false
      fruta_fresa:
        description: "Fresa"
        type: boolean
        default: false
      fruta_pera:
        description: "Pera"
        type: boolean
        default: false

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-ci:
    runs-on: ubuntu-latest
    outputs:
      ci_status: ${{ steps.get_ci.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CI
        id: get_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow ci.yml \
            --branch main \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CI conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  block-on-ci-failure:
    needs: check-ci
    if: needs.check-ci.outputs.ci_status != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Error - CI no finalizo correctamente
        run: |
          echo "::error::El pipeline CI termino con estado '${{ needs.check-ci.outputs.ci_status }}'. El deploy a DEV fue bloqueado."
          exit 1

  deploy-dev:
    needs: check-ci
    if: needs.check-ci.outputs.ci_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar version y frutas seleccionadas
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Frutas seleccionadas:"
          ${{ github.event.inputs.fruta_manzana == 'true' && 'echo "  - Manzana"' || 'true' }}
          ${{ github.event.inputs.fruta_naranja == 'true' && 'echo "  - Naranja"' || 'true' }}
          ${{ github.event.inputs.fruta_banana  == 'true' && 'echo "  - Banana"'  || 'true' }}
          ${{ github.event.inputs.fruta_uva     == 'true' && 'echo "  - Uva"'     || 'true' }}
          ${{ github.event.inputs.fruta_fresa   == 'true' && 'echo "  - Fresa"'   || 'true' }}
          ${{ github.event.inputs.fruta_pera    == 'true' && 'echo "  - Pera"'    || 'true' }}

      - name: Deploy a DEV
        run: |
          echo "Desplegando version ${{ env.VERSION }} en DEV"

    #   - name: Simular error
    #     run: exit 1
