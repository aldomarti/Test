# Continuous Deployment - Dev

name: CD_DEV
run-name: "CD-DEV-${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      fruta:
        description: "Selecciona una fruta"
        required: true
        type: choice
        options:
          - manzana
          - naranja
          - banana
          - uva
          - fresa
        default: manzana

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-ci:
    runs-on: ubuntu-latest
    outputs:
      ci_status: ${{ steps.get_ci.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CI
        id: get_ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow ci.yml \
            --branch main \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CI conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  deploy-dev:
    needs: check-ci
    if: needs.check-ci.outputs.ci_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar version y fruta seleccionada
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Fruta seleccionada: ${{ github.event.inputs.fruta }}"

      - name: Deploy a DEV
        run: |
          echo "Desplegando version ${{ env.VERSION }} en DEV"
          echo "Parametro fruta: ${{ github.event.inputs.fruta }}"

      - name: Simular error
        run: exit 1
