# Continuous Deployment - Dev

name: CD_UAT
run-name: "CD-UAT-${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      fruta:
        description: "Selecciona una fruta"
        required: true
        type: choice
        options:
          - manzana
          - naranja
          - banana
          - uva
          - fresa
        default: manzana

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  deploy-uat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar version y fruta seleccionada
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Fruta seleccionada: ${{ github.event.inputs.fruta }}"

      - name: Deploy a UAT
        run: |
          echo "Desplegando version ${{ env.VERSION }} en UAT"
          echo "Parametro fruta: ${{ github.event.inputs.fruta }}"
