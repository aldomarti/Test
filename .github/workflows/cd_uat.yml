# Continuous Deployment - Dev

name: CD_UAT
run-name: "CD-UAT-${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      fruta:
        description: "Selecciona una fruta"
        required: true
        type: choice
        options:
          - manzana
          - naranja
          - banana
          - uva
          - fresa
        default: manzana

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-cd-dev:
    runs-on: ubuntu-latest
    outputs:
      cd_dev_status: ${{ steps.get_cd_dev.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CD_DEV
        id: get_cd_dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow cd_dev.yml \
            --branch main \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CD_DEV conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  deploy-uat:
    needs: check-cd-dev
    if: needs.check-cd-dev.outputs.cd_dev_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar version y fruta seleccionada
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Fruta seleccionada: ${{ github.event.inputs.fruta }}"

      - name: Deploy a UAT
        run: |
          echo "Desplegando version ${{ env.VERSION }} en UAT"
          echo "Parametro fruta: ${{ github.event.inputs.fruta }}"
