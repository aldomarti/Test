# Continuous Deployment - Dev

name: CD_UAT
run-name: "CD-UAT-${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version (ej: 1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      fruta_manzana:
        description: "Manzana"
        type: boolean
        default: false
      fruta_naranja:
        description: "Naranja"
        type: boolean
        default: false
      fruta_banana:
        description: "Banana"
        type: boolean
        default: false
      fruta_uva:
        description: "Uva"
        type: boolean
        default: false
      fruta_fresa:
        description: "Fresa"
        type: boolean
        default: false

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  check-cd-dev:
    runs-on: ubuntu-latest
    outputs:
      cd_dev_status: ${{ steps.get_cd_dev.outputs.conclusion }}
    steps:
      - name: Verificar ultimo resultado del pipeline CD_DEV
        id: get_cd_dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh run list \
            --repo ${{ github.repository }} \
            --workflow cd_dev.yml \
            --branch main \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')
          echo "CD_DEV conclusion: $conclusion"
          echo "conclusion=$conclusion" >> $GITHUB_OUTPUT

  block-on-cd-dev-failure:
    needs: check-cd-dev
    if: needs.check-cd-dev.outputs.cd_dev_status != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Error - CD_DEV no finalizo correctamente
        run: |
          echo "::error::El pipeline CD_DEV termino con estado '${{ needs.check-cd-dev.outputs.cd_dev_status }}'. El deploy a UAT fue bloqueado."
          exit 1

  deploy-uat:
    needs: check-cd-dev
    if: needs.check-cd-dev.outputs.cd_dev_status == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Mostrar version y frutas seleccionadas
        run: |
          echo "Version: ${{ env.VERSION }}"
          echo "Frutas seleccionadas:"
          ${{ github.event.inputs.fruta_manzana == 'true' && 'echo "  - Manzana"' || 'true' }}
          ${{ github.event.inputs.fruta_naranja == 'true' && 'echo "  - Naranja"' || 'true' }}
          ${{ github.event.inputs.fruta_banana  == 'true' && 'echo "  - Banana"'  || 'true' }}
          ${{ github.event.inputs.fruta_uva     == 'true' && 'echo "  - Uva"'     || 'true' }}
          ${{ github.event.inputs.fruta_fresa   == 'true' && 'echo "  - Fresa"'   || 'true' }}

      - name: Deploy a UAT
        run: |
          echo "Desplegando version ${{ env.VERSION }} en UAT"

      # - name: Simular error
      #   run: exit 1